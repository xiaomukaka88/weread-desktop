<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320">
  <title>微信读书助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      color: #333;
      height: 100vh;
      overflow-y: auto;
      width: 320px;
      border-right: 1px solid #e0e0e0;
      box-shadow: 1px 0 8px rgba(0, 0, 0, 0.06);
    }

    /* Status section */
    .status-section {
      padding: 20px;
      background: #fff;
      margin: 12px;
      border-radius: 12px;
      border: 1px solid #e8e8e8;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ccc;
      transition: background 0.3s;
    }

    .status-dot.stopped { background: #ef4444; }
    .status-dot.login { background: #f59e0b; animation: blink 1s infinite; }
    .status-dot.reading { background: #22c55e; animation: pulse 2s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .status-text {
      font-size: 14px;
      font-weight: 600;
      color: #555;
    }

    .timer {
      font-size: 32px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: center;
      padding: 12px 0;
      color: #1a1a1a;
    }

    .timer-label {
      font-size: 12px;
      color: #999;
      text-align: center;
      margin-top: 4px;
    }

    .progress-bar {
      height: 4px;
      background: #e8e8e8;
      border-radius: 2px;
      margin-top: 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      border-radius: 2px;
      transition: width 0.5s ease;
      width: 0%;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 8px;
      padding: 4px 20px 16px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: #22c55e;
      color: #fff;
    }

    .btn-primary:hover { background: #16a34a; }

    .btn-primary.running {
      background: #ef4444;
    }

    .btn-primary.running:hover { background: #dc2626; }

    /* Settings */
    .settings-section {
      padding: 16px 20px;
      margin: 0 12px 12px;
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e8e8e8;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .setting-row:last-child { margin-bottom: 0; }

    .setting-label {
      font-size: 14px;
      color: #555;
    }

    .setting-select {
      background: #f5f5f5;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      min-width: 120px;
    }

    .setting-select:focus {
      outline: none;
      border-color: #22c55e;
    }

    .save-row {
      padding: 0;
    }

    .btn-save {
      width: 100%;
      padding: 10px;
      background: #533483;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
      margin-top: 12px;
    }

    .btn-save:hover { background: #6b44a0; }

    /* Logs */
    .logs-section {
      padding: 12px;
      margin: 0 12px 12px;
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e8e8e8;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .logs-container {
      max-height: 150px;
      overflow-y: auto;
      font-family: "Cascadia Code", "Fira Code", "Consolas", monospace;
      font-size: 11px;
      color: #888;
      line-height: 1.6;
      padding: 8px;
      background: #fafafa;
      border-radius: 8px;
    }

    .logs-container::-webkit-scrollbar { width: 6px; }
    .logs-container::-webkit-scrollbar-track { background: transparent; }
    .logs-container::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

    .log-entry { word-break: break-all; }
    .log-entry:last-child { color: #333; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #22c55e;
      color: #fff;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- Status -->
  <div class="status-section">
    <div class="status-indicator">
      <div class="status-dot stopped" id="statusDot"></div>
      <div class="status-text" id="statusText">已停止</div>
    </div>
    <div class="timer" id="timerDisplay">00:00</div>
    <div class="timer-label" id="timerLabel">点击开始阅读</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-primary" id="btnToggle">开始阅读</button>
  </div>

  <!-- Settings -->
  <div class="settings-section">
    <div class="section-title">设置</div>
    <div class="setting-row">
      <span class="setting-label">书架第几本</span>
      <select class="setting-select" id="bookSelection">
        <option value="1">第 1 本</option>
        <option value="2">第 2 本</option>
        <option value="3" selected>第 3 本</option>
      </select>
    </div>
    <div class="setting-row">
      <span class="setting-label">阅读速度</span>
      <select class="setting-select" id="speedSelection">
        <option value="slow">慢速</option>
        <option value="normal" selected>正常</option>
        <option value="fast">快速</option>
      </select>
    </div>
    <div class="save-row">
      <button class="btn-save" id="btnSave">保存设置</button>
    </div>
  </div>

  <!-- Logs -->
  <div class="logs-section">
    <div class="section-title">运行日志</div>
    <div class="logs-container" id="logsContainer"></div>
  </div>

  <div class="toast" id="toast">已保存</div>

  <script>
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const timerDisplay = document.getElementById("timerDisplay");
    const timerLabel = document.getElementById("timerLabel");
    const progressFill = document.getElementById("progressFill");
    const btnToggle = document.getElementById("btnToggle");
    const btnSave = document.getElementById("btnSave");
    const bookSelection = document.getElementById("bookSelection");
    const speedSelection = document.getElementById("speedSelection");
    const logsContainer = document.getElementById("logsContainer");
    const toast = document.getElementById("toast");

    let isRunning = false;

    // Format minutes to HH:MM
    function formatMinutes(mins) {
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }

    // Update status UI
    function updateStatus(data) {
      if (data.status === "login") {
        statusDot.className = "status-dot login";
        statusText.textContent = "扫码登录";
        timerDisplay.textContent = "等待扫码";
        timerLabel.textContent = "请使用手机微信扫码登录";
        progressFill.style.width = "0%";
        btnToggle.textContent = "停止";
        btnToggle.classList.add("running");
        isRunning = true;
      } else if (data.running) {
        statusDot.className = "status-dot reading";
        statusText.textContent = "阅读中";
        timerDisplay.textContent = formatMinutes(data.minutes);
        timerLabel.textContent = "";
        const pct = Math.min((data.minutes / 68) * 100, 100);
        progressFill.style.width = `${pct}%`;
        btnToggle.textContent = "停止";
        btnToggle.classList.add("running");
        isRunning = true;
      } else {
        statusDot.className = "status-dot stopped";
        statusText.textContent = "已停止";
        timerDisplay.textContent = formatMinutes(data.minutes);
        timerLabel.textContent = "点击开始阅读";
        progressFill.style.width = "0%";
        btnToggle.textContent = "开始阅读";
        btnToggle.classList.remove("running");
        isRunning = false;
      }
    }

    // Add log entry
    function addLog(data) {
      const entry = document.createElement("div");
      entry.className = "log-entry";
      entry.textContent = data.message;
      logsContainer.appendChild(entry);
      logsContainer.scrollTop = logsContainer.scrollHeight;

      // Keep max 200 entries
      while (logsContainer.children.length > 200) {
        logsContainer.removeChild(logsContainer.firstChild);
      }
    }

    // Show toast
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
    }

    // Event listeners
    btnToggle.addEventListener("click", async () => {
      if (isRunning) {
        await window.weread.stopReading();
      } else {
        await window.weread.startReading();
      }
    });

    btnSave.addEventListener("click", async () => {
      await window.weread.saveConfig({
        selection: parseInt(bookSelection.value),
        speed: speedSelection.value,
      });
      showToast("已保存");
    });

    // Listen for updates
    window.weread.onSessionUpdate(updateStatus);
    window.weread.onLog(addLog);

    // Load initial state
    async function init() {
      try {
        const config = await window.weread.getConfig();
        if (config.selection) {
          bookSelection.value = config.selection;
        }
        if (config.speed) {
          speedSelection.value = config.speed;
        }
      } catch (_) {}

      try {
        const status = await window.weread.getSessionStatus();
        updateStatus(status);
      } catch (_) {}
    }

    init();
  </script>
</body>
</html>
