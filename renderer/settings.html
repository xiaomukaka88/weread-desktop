<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url("styles/shared.css");

    body {
      overflow-y: auto;
      user-select: text;
      -webkit-app-region: no-drag;
    }

    #app {
      padding: 20px;
      max-width: 560px;
      margin: 0 auto;
    }

    h2 { font-size: 18px; margin-bottom: 16px; }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .tab {
      padding: 8px 16px;
      cursor: pointer;
      color: var(--text-secondary);
      border-bottom: 2px solid transparent;
      font-size: 14px;
    }
    .tab.active {
      color: var(--text-primary);
      border-bottom-color: var(--accent);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-size: 14px;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .user-list { margin-top: 12px; }
    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--bg-card);
      border-radius: var(--radius);
      margin-bottom: 6px;
    }
    .user-item .name { font-size: 14px; }
    .user-item button {
      padding: 4px 10px;
      background: var(--accent);
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 12px;
      cursor: pointer;
    }
    .user-actions {
      display: flex;
      gap: 4px;
    }
    .btn-sm {
      padding: 4px 10px;
      background: var(--bg-button);
      border: none;
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 12px;
      cursor: pointer;
    }
    .btn-danger {
      background: #c0392b;
    }
    .login-btn {
      background: var(--status-active);
    }
    .login-status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-right: 6px;
    }
    .login-status.logged-in {
      background: rgba(46, 204, 113, 0.15);
      color: #2ecc71;
    }
    .login-status.not-logged-in {
      background: rgba(255, 165, 0, 0.15);
      color: #f39c12;
    }

    .btn {
      padding: 8px 16px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-secondary {
      background: var(--bg-button);
    }

    #saveFeedback {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--status-active);
      color: white;
      padding: 6px 16px;
      border-radius: 12px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      z-index: 100;
    }
    #saveFeedback.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Add user dialog */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-box h3 {
      margin: 0;
      font-size: 16px;
    }
    .modal-box input {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg-dark);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-size: 14px;
    }
    .modal-box input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div id="saveFeedback">已保存</div>
  <div id="addUserModal" class="modal-overlay">
    <div class="modal-box">
      <h3 id="addUserTitle">添加用户</h3>
      <input type="text" id="addUserName" placeholder="用户名称" autofocus>
      <p id="addUserStatus" style="font-size:13px;color:var(--text-secondary);margin:0;display:none;"></p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelAddUser">取消</button>
        <button class="btn" id="confirmAddUser">确定</button>
      </div>
    </div>
  </div>
  <div id="confirmOverlay" class="modal-overlay">
    <div class="modal-box">
      <h3 id="confirmMessage">确认？</h3>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="confirmNo">取消</button>
        <button class="btn" id="confirmYes" style="background:#c0392b;">删除</button>
      </div>
    </div>
  </div>
  <div id="app">
    <h2>设置</h2>
    <div class="tabs">
      <div class="tab active" data-tab="basic">基础</div>
      <div class="tab" data-tab="users">用户</div>
      <div class="tab" data-tab="notify">通知</div>
      <div class="tab" data-tab="schedule">定时</div>
    </div>

    <div id="tab-basic" class="tab-content active">
      <div class="form-group">
        <label>浏览器</label>
        <select id="browser">
          <option value="chrome">Chrome</option>
          <option value="firefox">Firefox</option>
          <option value="MicrosoftEdge">Edge</option>
        </select>
      </div>
      <div class="form-group">
        <label>阅读时长（分钟）</label>
        <input type="number" id="duration" value="68" min="5" max="180">
      </div>
      <div class="form-group">
        <label>阅读速度</label>
        <select id="speed">
          <option value="slow">慢速</option>
          <option value="normal">正常</option>
          <option value="fast">快速</option>
        </select>
      </div>
      <div class="form-group">
        <label>选书方式</label>
        <select id="selection">
          <option value="2">书架第 2 本</option>
          <option value="-1">随机选择</option>
          <option value="1">最近阅读第 1 本</option>
        </select>
      </div>
      <button class="btn" id="saveBasic">保存</button>
    </div>

    <div id="tab-users" class="tab-content">
      <div class="user-list" id="userList"></div>
      <button class="btn btn-secondary" id="addUser" style="margin-top:12px;">+ 添加用户</button>
    </div>

    <div id="tab-notify" class="tab-content">
      <div class="form-group">
        <label><input type="checkbox" id="emailEnabled"> 启用邮件通知</label>
      </div>
      <div class="form-group">
        <label>SMTP 服务器</label>
        <input type="text" id="emailSmtp" placeholder="smtp.example.com">
      </div>
      <div class="form-group">
        <label>邮箱账号</label>
        <input type="text" id="emailUser">
      </div>
      <div class="form-group">
        <label>邮箱密码</label>
        <input type="password" id="emailPass">
      </div>
      <div class="form-group">
        <label>Bark Key</label>
        <input type="text" id="barkKey" placeholder="可选">
      </div>
      <button class="btn" id="saveNotify">保存</button>
    </div>

    <div id="tab-schedule" class="tab-content">
      <div class="form-group">
        <label><input type="checkbox" id="scheduleEnabled"> 启用定时任务</label>
      </div>
      <div class="form-group">
        <label>间隔（分钟）</label>
        <input type="number" id="scheduleInterval" value="360" min="60" max="1440">
      </div>
      <button class="btn" id="saveSchedule">保存</button>
    </div>
  </div>

  <script>
    // Tab switching
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById("tab-" + tab.dataset.tab).classList.add("active");
      });
    });

    async function loadSettings() {
      const config = await window.weread.getUsers();
      const user = config.users[config.activeUserId];
      if (!user) return;

      document.getElementById("browser").value = user.browser || "chrome";
      document.getElementById("duration").value = user.duration || 68;
      document.getElementById("speed").value = user.speed || "slow";
      document.getElementById("selection").value = user.selection ?? 2;

      // Email
      document.getElementById("emailEnabled").checked = user.email?.enabled || false;
      document.getElementById("emailSmtp").value = user.email?.smtp || "";
      document.getElementById("emailUser").value = user.email?.user || "";
      document.getElementById("emailPass").value = user.email?.pass || "";
      document.getElementById("barkKey").value = user.bark?.key || "";

      // Schedule
      document.getElementById("scheduleEnabled").checked = user.schedule?.enabled || false;
      document.getElementById("scheduleInterval").value = user.schedule?.intervalMinutes || 360;

      // User list
      const userList = document.getElementById("userList");
      userList.innerHTML = "";
      for (const [id, u] of Object.entries(config.users)) {
        const div = document.createElement("div");
        div.className = "user-item";
        const isCurrent = id === config.activeUserId;
        const isLoggedIn = await window.weread.checkUserLogin(id);
        div.innerHTML = `<span class="name">${u.name}${isCurrent ? " (当前)" : ""}</span>
          <span class="user-actions">
            <span class="login-status ${isLoggedIn ? 'logged-in' : 'not-logged-in'}">${isLoggedIn ? '已登录' : '未登录'}</span>
            ${isLoggedIn ? "" : `<button class="btn btn-sm login-btn" onclick="window._loginUser('${id}')">去登录</button>`}
            ${isCurrent ? "" : `<button class="btn btn-sm" onclick="window._switchUser('${id}')">切换</button>`}
            <button class="btn btn-sm btn-danger" onclick="window._removeUser('${id}')">删除</button>
          </span>`;
        userList.appendChild(div);
      }
    }

    document.getElementById("saveBasic").addEventListener("click", async () => {
      const config = await window.weread.getUsers();
      const user = config.users[config.activeUserId];
      user.browser = document.getElementById("browser").value;
      user.duration = parseInt(document.getElementById("duration").value);
      user.speed = document.getElementById("speed").value;
      user.selection = parseInt(document.getElementById("selection").value);
      await window.weread.saveUsers(config);
      showSaveFeedback();
    });

    document.getElementById("addUser").addEventListener("click", () => {
      const modal = document.getElementById("addUserModal");
      const input = document.getElementById("addUserName");
      input.value = "";
      modal.classList.add("show");
      input.focus();
    });

    async function doAddUser() {
      const input = document.getElementById("addUserName");
      const name = input.value.trim();
      if (!name) return;

      const config = await window.weread.getUsers();
      const id = "user-" + Date.now();
      config.users[id] = {
        id, name, duration: 68, browser: "chrome", selection: 2, speed: "slow",
        email: { enabled: false, smtp: "", user: "", pass: "", from: "", to: "", port: 465 },
        bark: { key: "", server: "https://api.day.app" },
        schedule: { enabled: false, intervalMinutes: 360 },
      };
      await window.weread.saveUsers(config);

      // Now trigger login via browser
      await performLogin(id, true);
      loadSettings();
      showSaveFeedback();
    }

    async function performLogin(userId, fromModal = true) {
      let statusEl = null;
      let titleEl = null;
      let confirmBtn = null;
      let cancelBtn = null;
      let input = null;

      if (fromModal) {
        input = document.getElementById("addUserName");
        statusEl = document.getElementById("addUserStatus");
        titleEl = document.getElementById("addUserTitle");
        confirmBtn = document.getElementById("confirmAddUser");
        cancelBtn = document.getElementById("cancelAddUser");

        // Show login-in-progress UI
        if (input) input.style.display = "none";
        if (confirmBtn) confirmBtn.style.display = "none";
        if (cancelBtn) cancelBtn.textContent = "关闭";
        if (statusEl) {
          statusEl.style.display = "block";
          statusEl.style.color = "";
          statusEl.textContent = "正在打开浏览器，请在弹出的浏览器窗口中扫描二维码登录...";
        }
        if (titleEl) titleEl.textContent = "正在登录...";
      } else {
        showToast("正在打开浏览器，请在弹出的窗口中扫码登录...");
      }

      const result = await window.weread.loginUser(userId);

      // Reset modal
      if (fromModal) {
        if (input) input.style.display = "";
        if (confirmBtn) confirmBtn.style.display = "";
        if (cancelBtn) cancelBtn.textContent = "取消";
        if (titleEl) titleEl.textContent = "添加用户";
        if (statusEl) {
          if (result.success) {
            statusEl.textContent = "登录成功！";
            statusEl.style.color = "var(--status-active)";
            setTimeout(() => { closeModal(); }, 1000);
          } else {
            statusEl.textContent = "登录失败: " + (result.error || "未知错误");
            statusEl.style.display = "block";
          }
        }
      } else {
        if (result.success) {
          showToast("登录成功！");
        } else {
          showToast("登录失败: " + (result.error || "未知错误"));
        }
      }
    }

    document.getElementById("confirmAddUser").addEventListener("click", doAddUser);
    document.getElementById("cancelAddUser").addEventListener("click", closeModal);
    document.getElementById("addUserName").addEventListener("keydown", (e) => {
      if (e.key === "Enter") doAddUser();
      if (e.key === "Escape") closeModal();
    });

    function closeModal() {
      const statusEl = document.getElementById("addUserStatus");
      statusEl.style.color = "";
      document.getElementById("addUserModal").classList.remove("show");
    }

    document.getElementById("saveNotify").addEventListener("click", async () => {
      const config = await window.weread.getUsers();
      const user = config.users[config.activeUserId];
      user.email.enabled = document.getElementById("emailEnabled").checked;
      user.email.smtp = document.getElementById("emailSmtp").value;
      user.email.user = document.getElementById("emailUser").value;
      user.email.pass = document.getElementById("emailPass").value;
      user.bark.key = document.getElementById("barkKey").value;
      await window.weread.saveUsers(config);
      showSaveFeedback();
    });

    document.getElementById("saveSchedule").addEventListener("click", async () => {
      const config = await window.weread.getUsers();
      const user = config.users[config.activeUserId];
      user.schedule.enabled = document.getElementById("scheduleEnabled").checked;
      user.schedule.intervalMinutes = parseInt(document.getElementById("scheduleInterval").value);
      await window.weread.saveUsers(config);
      showSaveFeedback();
    });

    function showSaveFeedback() {
      const el = document.getElementById("saveFeedback");
      el.classList.add("show");
      setTimeout(() => {
        el.classList.remove("show");
      }, 1500);
    }

    // User actions (exposed on window for inline onclick)
    window._switchUser = async (userId) => {
      await window.weread.setActiveUser(userId);
      loadSettings();
      showSaveFeedback();
    };

    window._removeUser = async (userId) => {
      const config = await window.weread.getUsers();
      const userCount = Object.keys(config.users).length;
      if (userCount <= 1) {
        showToast("至少保留一个用户");
        return;
      }
      const user = config.users[userId];
      const confirmed = await confirmDialog(`确认删除用户 "${user.name}"？`);
      if (!confirmed) return;
      await window.weread.removeUser(userId);
      loadSettings();
      showSaveFeedback();
    };

    window._loginUser = async (userId) => {
      await window.weread.setActiveUser(userId);
      await performLogin(userId, false);
      loadSettings();
      showSaveFeedback();
    };

    function showToast(message) {
      const el = document.getElementById("saveFeedback");
      el.textContent = message;
      el.style.background = "#c0392b";
      el.classList.add("show");
      setTimeout(() => {
        el.classList.remove("show");
        el.style.background = "";
        el.textContent = "已保存";
      }, 2000);
    }

    function confirmDialog(message) {
      const overlay = document.getElementById("confirmOverlay");
      overlay.querySelector("#confirmMessage").textContent = message;
      overlay.classList.add("show");
      return new Promise((resolve) => {
        window._confirmResolve = (val) => { resolve(val); };
      }).then((val) => {
        overlay.classList.remove("show");
        return val;
      });
    }

    document.getElementById("confirmYes").addEventListener("click", () => {
      if (window._confirmResolve) window._confirmResolve(true);
    });
    document.getElementById("confirmNo").addEventListener("click", () => {
      if (window._confirmResolve) window._confirmResolve(false);
    });

    loadSettings();
  </script>
</body>
</html>
